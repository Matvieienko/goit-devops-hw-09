# MinIO: об'єктне сховище (S3 API), тут зберігаються артефакти моделей MLflow
# (файли моделі, приклади input, і т.д. - усе, що НЕ поміщається рядком у БД).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - containerPort: 9000   # S3 API
            - containerPort: 9001   # Web console
          env:
            # TODO: облікові дані MinIO. Для навчального середовища можна
            # задати напряму, у продакшн-коді - тільки через Secret.
            - name: MINIO_ROOT_USER
              value: "minioadmin"
            - name: MINIO_ROOT_PASSWORD
              value: "minioadmin123"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-bucket
          image: minio/mc:latest
          command:
            - /bin/sh
            - -c
            - |
              until mc alias set minio http://minio:9000 minioadmin minioadmin123; do
                echo "Waiting for MinIO..."
                sleep 2
              done
              mc mb --ignore-existing minio/mlflow-artifacts
