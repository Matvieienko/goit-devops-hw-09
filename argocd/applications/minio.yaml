# Argo CD Application для MinIO (S3-сумісне сховище артефактів MLflow).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow-minio
  namespace: infra-tools
spec:
  project: default
  source:
    repoURL: https://github.com/Matvieienko/goit-devops-hw-09.git
    targetRevision: lesson-9
    path: mlops-experiments/argocd/workloads/minio
  destination:
    server: https://kubernetes.default.svc
    namespace: application
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
