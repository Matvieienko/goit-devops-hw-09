# Argo CD Application для PostgreSQL (метадані MLflow: runs, params, metrics).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow-postgres
  namespace: infra-tools
spec:
  project: default
  source:
    repoURL: https://github.com/Matvieienko/goit-devops-hw-09.git
    targetRevision: lesson-9
    path: argocd/workloads/postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: application
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
