# Argo CD Application для Prometheus PushGateway, розгорнутого з готового Helm-чарту.
# На відміну від трьох попередніх файлів, тут немає власного workloads/*.yaml -
# все налаштування живе у valuesObject (аналог --set / values.yaml для Helm).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-pushgateway
  namespace: infra-tools
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-pushgateway
    targetRevision: 3.8.0 #3.6.1
    helm:
      releaseName: pushgateway
      valuesObject:
        service:
          type: ClusterIP
          port: 9091
        persistentVolume:
          enabled: false   # метрики короткоживучі, тримати диск не потрібно
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 150m
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
